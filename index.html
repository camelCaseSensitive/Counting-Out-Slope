<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Slope March — Curved Counting Arrows</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17243a;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:1240px;margin:auto;padding:22px}h1{font-size:26px;margin:0 0 5px}.sub{color:#526175;margin:0 0 19px}.layout{display:grid;grid-template-columns:315px minmax(0,1fr);gap:18px}.panel,.display{background:#fff;border:1px solid #d6dfeb;border-radius:15px;box-shadow:0 3px 18px #1829440d}.panel{padding:20px;align-self:start}.panel h2{font-size:15px;margin:0 0 16px}.field{margin:0 0 17px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.pair{display:flex;gap:8px;align-items:center}.pair input{width:50%;min-width:0}input,select{width:100%;height:38px;padding:6px 9px;border:1px solid #bfcbda;border-radius:8px;background:white;color:#17243a;font:inherit}input[type=range]{padding:0;height:25px;accent-color:#1671be}.range-caption{font-size:12px;color:#61718a;float:right}.toggle{display:flex;gap:9px;align-items:center;font-size:13px;margin:9px 0}.toggle input{width:16px;height:16px;accent-color:#1671be}button{border:1px solid #b8c7d9;border-radius:9px;padding:10px 11px;background:#fff;color:#183049;cursor:pointer;font-weight:650}button.primary{background:#146bb6;color:#fff;border-color:#146bb6}button:hover{filter:brightness(.96)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.display{min-width:0;padding:16px}.display-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}.math{font-size:19px;font-weight:650}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:center;line-height:1.1;font-size:.87em}.frac .top{border-bottom:1.6px solid;padding:0 4px 2px}.frac .bottom{padding:2px 4px 0}.hint{color:#65748a;font-size:13px}.paper{border:1px solid #d9e1ea;border-radius:9px;overflow:hidden;background:white}svg{display:block;width:100%;height:auto;max-height:72vh}.foot{font-size:13px;color:#526175;margin:11px 0 0}.warn{color:#aa3c2b;font-size:12px;min-height:18px}.small{font-size:12px;color:#61718a}.buttons{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.buttons button{padding:7px 10px;font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.app{padding:12px}.display{padding:10px}svg{max-height:none}}@media print{body{background:white}.panel,.sub,.buttons,.foot,.hint,.warn{display:none!important}.app{padding:0}.layout{display:block}.display{border:0;box-shadow:none;padding:0}.paper{border:0}svg{max-height:9in}h1{font-size:20px;margin:0 0 10px}}
</style></head><body><main class="app"><h1>March Along a Slope</h1><p class="sub">Automatically draw the curved, one-square-at-a-time counting arrows on graph paper.</p><div class="layout"><aside class="panel"><h2>Build your slope</h2>
<div class="field"><label>Slope = rise / run</label><div class="pair"><input id="rise" type="number" step="1" value="2" aria-label="Rise"><span>/</span><input id="run" type="number" step="1" min="1" value="1" aria-label="Run"></div><div class="small" style="margin-top:5px">For slope 2, enter 2 / 1. For −2/3, enter −2 / 3.</div></div>
<div class="field"><label for="marches">Number of complete marches <span class="range-caption" id="marchVal">3</span></label><input id="marches" type="range" min="1" max="7" value="3"></div>
<div class="field"><label for="direction">Direction along the line</label><select id="direction"><option value="right">Travel right (positive x)</option><option value="left">Travel left (negative x)</option></select></div>
<div class="field"><label for="order">Counting order</label><select id="order"><option value="vertical">Vertical steps, then horizontal steps (like example)</option><option value="horizontal">Horizontal steps, then vertical steps</option></select></div>
<div class="field"><label for="bend">Arrow arch <span class="range-caption" id="bendVal">34%</span></label><input id="bend" type="range" min="0" max="55" value="34"></div>
<div class="field"><label for="headSize">Arrowhead size <span class="range-caption" id="headSizeVal">18 px</span></label><input id="headSize" type="range" min="5" max="38" step="1" value="18"></div>
<div class="field"><label for="color">Arrow color</label><input id="color" type="color" value="#1576c9" style="width:100%;padding:3px"></div>
<div class="field"><label for="scale">Grid size <span class="range-caption" id="scaleVal">70 px</span></label><input id="scale" type="range" min="30" max="100" value="70"></div>
<label class="toggle"><input id="grid" type="checkbox" checked> Show graph-paper grid</label><label class="toggle"><input id="dots" type="checkbox" checked> Show black landing points</label><label class="toggle"><input id="line" type="checkbox"> Show underlying slope line</label><label class="toggle"><input id="labels" type="checkbox" checked> Show slope and march instructions</label><label class="toggle"><input id="numbers" type="checkbox"> Number each complete march</label>
<div class="actions"><button class="primary" id="svgBtn">Download SVG</button><button id="pngBtn">Download PNG</button><button id="printBtn">Print</button><button id="resetBtn">Reset</button></div></aside>
<section class="display"><div class="display-head"><div id="math" class="math">Slope = 2</div><div class="buttons"><button id="presetA">2</button><button id="presetB">1/3</button><button id="presetC">−2/3</button><button id="presetD">−2</button></div></div><div class="paper" id="paper"><svg xmlns="http://www.w3.org/2000/svg" id="diagram" aria-label="Slope counting illustration" role="img"></svg></div><p class="foot" id="description"></p><p class="warn" id="warning"></p></section></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id), els=['rise','run','marches','direction','order','bend','headSize','color','scale','grid','dots','line','labels','numbers'];const svg=$('diagram');const NS='http://www.w3.org/2000/svg';let actualSVG='';const make=(name,attrs={},parent=svg)=>{const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));parent.appendChild(e);return e};const pretty=(a,b)=>{if(b===1)return String(a);return `${a}/${b}`};const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function draw(){let rise=Number($('rise').value),run=Number($('run').value);const n=Number($('marches').value),d=$('direction').value==='right'?1:-1,order=$('order').value,scale=Number($('scale').value),bend=Number($('bend').value)/100,headSize=Number($('headSize').value),color=$('color').value;for(let k of ['marches','bend','scale'])$(k==='marches'?'marchVal':k==='bend'?'bendVal':'scaleVal').textContent=k==='marches'?String(n):k==='bend'?Math.round(bend*100)+'%':scale+' px';$('headSizeVal').textContent=headSize+' px';$('warning').textContent='';if(!Number.isInteger(rise)||!Number.isInteger(run)||run<1||Math.abs(rise)>15||run>15){$('warning').textContent='Use integer rise and run (run at least 1), with values no larger than 15.';return}const dx=d*run,dy=d*rise;let pts=[{x:0,y:0}],steps=[],pos={x:0,y:0};for(let m=0;m<n;m++){let part=order==='vertical'?[{x:0,y:Math.sign(dy),num:Math.abs(dy)},{x:Math.sign(dx),y:0,num:Math.abs(dx)}]:[{x:Math.sign(dx),y:0,num:Math.abs(dx)},{x:0,y:Math.sign(dy),num:Math.abs(dy)}];for(let p of part){for(let i=0;i<p.num;i++){let from={...pos};pos={x:pos.x+p.x,y:pos.y+p.y};steps.push({from,to:{...pos},vertical:p.y!==0});}}pts.push({...pos})}
const xs=[...pts.map(p=>p.x),...steps.map(s=>s.to.x)],ys=[...pts.map(p=>p.y),...steps.map(s=>s.to.y)];const pad=1.15;const minX=Math.min(...xs)-pad,maxX=Math.max(...xs)+pad,minY=Math.min(...ys)-pad,maxY=Math.max(...ys)+pad;const W=(maxX-minX)*scale,H=(maxY-minY)*scale;svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('width',W);svg.setAttribute('height',H);svg.style.background='#fff';const X=x=>(x-minX)*scale,Y=y=>(maxY-y)*scale;
make('rect',{width:W,height:H,fill:'white'});if($('grid').checked){const g=make('g',{'stroke':'#9b9b9b','stroke-width':Math.max(1,scale*.021),'opacity':'.75'});for(let x=Math.ceil(minX);x<=maxX;x++)make('line',{x1:X(x),y1:0,x2:X(x),y2:H},g);for(let y=Math.ceil(minY);y<=maxY;y++)make('line',{x1:0,y1:Y(y),x2:W,y2:Y(y)},g)}
if($('line').checked){const g=make('g',{'stroke':'#8b9db3','stroke-width':Math.max(1,scale*.024),'stroke-dasharray':'5 5','fill':'none'});make('line',{x1:X(pts[0].x),y1:Y(pts[0].y),x2:X(pos.x),y2:Y(pos.y)},g)}
const defs=make('defs');
// Keep the original arrowhead and the original quadratic arch. The marker's
// reference point is moved back to its base, so the tip extends beyond the shaft.
const marker=make('marker',{id:'arrowHead',viewBox:'0 0 12 12',refX:5,refY:6,markerWidth:headSize,markerHeight:headSize,markerUnits:'userSpaceOnUse',orient:'auto-start-reverse'},defs);
make('path',{d:'M 1 1 L 11 6 L 1 11 Z',fill:color},marker);
const paths=make('g',{'fill':'none','stroke':color,'stroke-width':Math.max(2.6,scale*.07),'stroke-linecap':'round','stroke-linejoin':'round'});
for(const s of steps){
  const x1=X(s.from.x),y1=Y(s.from.y),x2=X(s.to.x),y2=Y(s.to.y),vx=x2-x1,vy=y2-y1;
  let cx=(x1+x2)/2,cy=(y1+y2)/2;
  // Original arch shape (unchanged).
  if(s.vertical)cx-=bend*scale*1.12;else cy-=bend*scale*.95;
  const endX=x2-vx*.06,endY=y2-vy*.06;
  // Cut off only the end of the EXISTING quadratic curve (De Casteljau).
  // This preserves its exact shape, rather than bending it toward the arrowhead.
  const tipOffset=headSize*.5;
  const tangentLength=Math.hypot(2*(endX-cx),2*(endY-cy));
  const t=Math.max(.60,1-tipOffset/Math.max(1,tangentLength));
  const ax=x1+(cx-x1)*t,ay=y1+(cy-y1)*t;
  const bx=cx+(endX-cx)*t,by=cy+(endY-cy)*t;
  const ex=ax+(bx-ax)*t,ey=ay+(by-ay)*t;
  make('path',{d:`M ${x1.toFixed(2)} ${y1.toFixed(2)} Q ${ax.toFixed(2)} ${ay.toFixed(2)} ${ex.toFixed(2)} ${ey.toFixed(2)}`,'marker-end':'url(#arrowHead)'},paths);
}
if($('dots').checked){const g=make('g',{fill:'#151515',stroke:'white','stroke-width':scale*.018});for(const p of pts)make('circle',{cx:X(p.x),cy:Y(p.y),r:scale*.095},g)}if($('numbers').checked){const g=make('g',{fill:'#1f2937','font-family':'sans-serif','font-size':scale*.23,'font-weight':700});pts.slice(1).forEach((p,i)=>{const t=make('text',{x:X(p.x)+scale*.17,y:Y(p.y)-scale*.15},g);t.textContent=String(i+1)})}
const s=pretty(rise,run);$('math').textContent='Slope = '+s;const dir=d===1?'right':'left';const vertical=dy===0?'no vertical steps':dy>0?`up ${Math.abs(rise)}`:`down ${Math.abs(rise)}`;let instructions=`March ${dir} ${run}, ${vertical} — repeat ${n} ${n===1?'time':'times'}.`;$('description').textContent=instructions;
if($('labels').checked){const labels=make('g',{'font-family':'Arial, sans-serif',fill:'#1a2c42'});const height=scale*.29;const name=make('text',{x:W/2,y:scale*.34,'text-anchor':'middle','font-size':height*1.2,'font-weight':700},labels);name.textContent=`Slope ${s}`;const note=make('text',{x:W/2,y:H-scale*.22,'text-anchor':'middle','font-size':height*.8},labels);note.textContent=instructions}actualSVG=new XMLSerializer().serializeToString(svg)}
function save(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}function svgText(){const clone=svg.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.removeAttribute('style');return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone)}$('svgBtn').addEventListener('click',()=>save(new Blob([svgText()],{type:'image/svg+xml;charset=utf-8'}),'slope-march.svg'));
$('pngBtn').addEventListener('click',()=>{const blob=new Blob([svgText()],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{const c=document.createElement('canvas');const w=Number(svg.getAttribute('width')),h=Number(svg.getAttribute('height')),factor=Math.min(3,7000/Math.max(w,h));c.width=Math.ceil(w*factor);c.height=Math.ceil(h*factor);const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(p=>{if(p)save(p,'slope-march.png');URL.revokeObjectURL(url)},'image/png')};img.onerror=()=>{$('warning').textContent='PNG export failed; please use SVG instead.';URL.revokeObjectURL(url)};img.src=url});$('printBtn').addEventListener('click',()=>window.print());$('resetBtn').addEventListener('click',()=>{const values={rise:2,run:1,marches:3,direction:'right',order:'vertical',bend:34,headSize:18,color:'#1576c9',scale:70,grid:true,dots:true,line:false,labels:true,numbers:false};for(const[k,v]of Object.entries(values)){if(typeof v==='boolean')$(k).checked=v;else $(k).value=v}draw()});for(const [id,rise,run] of [['presetA',2,1],['presetB',1,3],['presetC',-2,3],['presetD',-2,1]])$(id).addEventListener('click',()=>{$('rise').value=rise;$('run').value=run;draw()});for(let id of els)$(id).addEventListener('input',draw);draw()})();
</script></body></html>
